<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X 标签画像发布日志</title><link rel="stylesheet" href="/x-tag-publish-ui.css?v=1"><style>body{margin:0;background:#f5f7fb;color:#23324b;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1450px;margin:auto;padding:26px}h1{font-size:25px}form{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{font:inherit;padding:10px;border:1px solid #d7dfeb;border-radius:8px;background:white}button{cursor:pointer;color:#4338ca}.scroll{overflow:auto;background:white;border:1px solid #d7dfeb;border-radius:12px}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #e5eaf2;text-align:left;vertical-align:top;font-size:14px}th{background:#edf2fa}small{display:block;line-height:1.6;color:#68758c;margin-top:5px}.pager{display:flex;gap:15px;align-items:center;margin-top:15px}a{color:#4338ca}</style></head><body><main><h1>画像发布日志</h1><p>本页仅统计标签画像流程。点击“分配详情”查看冻结的画像版本、标签及降级原因。</p><form id="filters"><input name="run_date" type="date" aria-label="发布日期"><input name="account_id" placeholder="频道内部 ID"><input name="material_id" placeholder="素材 ID"><select name="status" aria-label="状态"><option value="">全部状态</option value="published">已发布</option><option value="queued">排队中</option><option value="failed">失败</option><option value="publishing">发布中</option></select><button>查询</button><button type="button" id="reset">重置筛选</button></form><p id="message" role="status"></p><div class="scroll"><table><thead><tr><th>日期 / 队列</th><th>频道</th><th>剧目 / 素材</th><th>状态</th><th>分配详情</th><th>链接</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main><script src="/x-tag-publish-ui.js?v=2"></script><script src="/x-tag-post-logs.js?v=1"></script></body></html>

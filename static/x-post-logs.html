<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Post 发布日志 - AI自动后台</title>
  <link rel="stylesheet" href="/ui-topbar.css" />
  <style>
    :root { color-scheme:light; --ink:#13233a; --muted:#687894; --line:#dce5f1; --blue:#2563eb; --green:#14885f; --amber:#a66a05; --red:#c43b49; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(circle at 72% -10%,rgba(37,99,235,.12),transparent 35%),#f4f7fb; }
    button,input,select { font:inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns:270px minmax(0,1fr); }
    .sidebar { padding:24px 18px; background:linear-gradient(180deg,#0e1d35,#162c50); color:#fff; }
    .brand { display:flex; align-items:center; gap:12px; margin:0 8px 22px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(135deg,#2f66ff,#21c78b); font-weight:900; }
    .brand strong,.brand span { display:block; }
    .brand span { margin-top:3px; color:rgba(230,239,255,.62); font-size:12px; }
    .main { min-width:0; padding:26px 30px 44px; }
    .topbar { margin-bottom:22px; }
    .title h1 { margin:0; font-size:28px; letter-spacing:-.02em; }
    .title p { margin:7px 0 0; color:var(--muted); font-size:14px; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .button { min-height:40px; padding:0 16px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); cursor:pointer; font-weight:700; box-shadow:0 7px 18px rgba(31,51,82,.06); }
    .button.primary { border-color:var(--blue); background:var(--blue); color:#fff; }
    .button:disabled { opacity:.55; cursor:not-allowed; }
    .panel { padding:20px; border:1px solid rgba(210,222,238,.9); border-radius:18px; background:rgba(255,255,255,.94); box-shadow:0 16px 42px rgba(30,51,83,.07); }
    .panel + .panel { margin-top:18px; }
    .section-head { margin-bottom:14px; }
    .section-head h2 { margin:0; font-size:18px; }
    .section-head p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    .hidden { display:none !important; }
    .gate { padding:48px 24px; text-align:center; color:var(--muted); }
    .gate strong { display:block; margin-bottom:8px; color:var(--ink); font-size:18px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .stat { min-height:104px; padding:17px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .stat span { color:var(--muted); font-size:13px; }
    .stat strong { display:block; margin-top:11px; font-size:26px; }
    .filters { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)) auto auto; gap:10px; margin-bottom:16px; }
    .filters input,.filters select { min-height:40px; width:100%; padding:0 12px; border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--ink); outline:none; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; }
    table { width:100%; min-width:1560px; border-collapse:collapse; background:#fff; }
    table.run-table { min-width:980px; }
    th,td { padding:13px 14px; border-bottom:1px solid #e8eef6; vertical-align:top; text-align:left; font-size:13px; }
    th { position:sticky; top:0; z-index:1; background:#f7f9fc; color:#5d6d86; font-size:12px; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    th:first-child,td:first-child { position:sticky; left:0; z-index:2; background:#fff; }
    th:last-child,td:last-child { position:sticky; right:0; z-index:2; background:#fff; box-shadow:-4px 0 7px rgba(30,51,83,.04); }
    th:first-child,th:last-child { z-index:3; background:#f7f9fc; }
    .status { display:inline-flex; min-height:27px; align-items:center; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; }
    .status.published,.status.completed { color:#08734f; background:#e8f8f1; }
    .status.unknown,.status.needs_review,.status.stopped,.status.post_creating,.status.media_uploading,.status.waiting_relay { color:#925d00; background:#fff4d9; }
    .status.failed,.status.failed_preflight,.status.completed_with_errors { color:#ad2f3b; background:#ffedef; }
    .status.reserved,.status.queued,.status.planned,.status.running { color:#2457b8; background:#eef4ff; }
    .status.other { color:#56657b; background:#edf1f6; }
    .subtle { margin-top:4px; color:var(--muted); font-size:12px; line-height:1.5; }
    .error { max-width:320px; color:#a62f3a; line-height:1.45; word-break:break-word; }
    .links { display:flex; flex-direction:column; gap:6px; min-width:116px; }
    .links a { color:var(--blue); font-weight:700; text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .empty { padding:44px 18px; text-align:center; color:var(--muted); }
    .pager { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; color:var(--muted); font-size:13px; }
    .pager-actions { display:flex; gap:8px; }
    .bulk-actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }
    .action-result { margin:0 0 14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#f7f9fc; font-size:13px; line-height:1.7; white-space:pre-wrap; max-height:240px; overflow:auto; }
    .row-actions { display:flex; flex-direction:column; gap:8px; min-width:118px; }
    .row-actions .button { min-height:32px; font-size:12px; }
    input[type="checkbox"] { width:17px; height:17px; cursor:pointer; accent-color:var(--blue); }
    input[type="checkbox"]:disabled { cursor:not-allowed; }
    @media (max-width:1200px) { .filters { grid-template-columns:repeat(3,minmax(120px,1fr)); } }
    @media (max-width:820px) { .app { grid-template-columns:1fr; } .sidebar { padding:18px; } .main { padding:20px 16px 36px; } .stats,.filters { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">AI</div><div><strong>AI自动后台</strong><span>ai.yingliangads.com</span></div></div>
      <nav id="quickNav" class="nav"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="title"><h1>X Post 发布日志</h1><p>查看各来源的发布队列、结果和公开链接，重置或停止指定队列。</p></div>
        <div class="top-actions">
          <div id="userCard" class="user-card"></div>
          <button id="refreshPage" class="button" type="button">刷新页面</button>
          <button id="authButton" class="button" type="button">登录</button>
        </div>
      </header>

      <section id="loginGate" class="panel gate hidden"><strong>请先登录 AI 自动后台</strong><span>登录后才能查看发布日志。</span></section>
      <section id="adminGate" class="panel gate hidden"><strong>仅管理员可以查看发布日志</strong><span>日志包含全账号的选材与发布结果。</span></section>

      <div id="pageRoot" class="hidden">
        <section class="panel">
          <div class="section-head"><h2>Post 发布明细</h2><p>按队列查看发布明细；重置沿用原素材和链接，已发布及结果待核对的记录不能重发。</p></div>
          <form id="filters" class="filters">
            <input id="runDate" type="date" aria-label="运行日期" />
            <input id="accountId" inputmode="numeric" placeholder="账号 ID" aria-label="账号 ID" />
            <input id="materialId" inputmode="numeric" placeholder="素材 ID" aria-label="素材 ID" />
            <select id="taskSource" aria-label="任务来源">
              <option value="">全部来源</option>
              <option value="drama_pool">短剧池</option>
              <option value="material_pool">素材池</option>
              <option value="auto_publish">自动发布</option>
              <option value="manual_publish">手动发布</option>
            </select>
            <select id="status" aria-label="发布状态">
              <option value="">全部状态</option>
              <option value="published">已发布</option>
              <option value="failed">发布失败</option>
              <option value="stopped">已停止</option>
              <option value="queued">已入队</option>
              <option value="reserved">已预留</option>
              <option value="waiting_relay">等待同语言会员号</option>
              <option value="media_uploading">媒体上传中</option>
              <option value="post_creating">创建 Post 中</option>
            </select>
            <select id="unknownOutcome" aria-label="结果是否待确认">
              <option value="">全部结果</option>
              <option value="1">仅结果待确认</option>
              <option value="0">排除结果待确认</option>
            </select>
            <button class="button primary" type="submit">查询</button>
            <button id="resetFilters" class="button" type="button">重置</button>
          </form>

          <div class="bulk-actions">
            <span>共 <strong id="resultTotal">0</strong> 条 · <span id="selectionCount">已选 0 条</span></span>
            <button id="bulkReset" class="button primary" type="button" disabled>批量重置发布</button>
            <button id="clearSelection" class="button" type="button" disabled>取消勾选</button>
            <button id="retryAction" class="button hidden" type="button">重试上次操作</button>
          </div>
          <div id="actionResult" class="action-result hidden" role="status" aria-live="polite"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th><input id="selectPage" type="checkbox" aria-label="全选当前页可操作队列" /></th><th>运行/参考日期</th><th>任务来源</th><th>X账号</th><th>素材</th><th>短剧</th><th>素材池顺序</th><th>状态</th><th>链接</th><th>时间</th><th>错误</th><th>操作</th></tr></thead>
              <tbody id="logRows"><tr><td colspan="12" class="empty">正在加载…</td></tr></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <div class="pager-actions"><button id="prevPage" class="button" type="button">上一页</button><button id="nextPage" class="button" type="button">下一页</button></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/ui-topbar.js"></script>
  <script src="/quick-nav.js?v=d64e9c9ccd31"></script>
  <script src="/x-post-logs.js?v=20261105-queue-controls-1"></script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>FB Page 发布记录 - AI自动后台</title><link rel="stylesheet" href="/ui-topbar.css"><style>body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#101828;color:#fff;padding:22px}.main{padding:24px;min-width:0}.topbar,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px;margin-top:16px}.button{border:1px solid #d0d5dd;background:white;border-radius:7px;padding:8px 12px}.hidden{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px}.badge{background:#eef4ff;padding:3px 7px;border-radius:99px}dialog{max-width:900px;width:90%;border:0;border-radius:12px;padding:18px}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:900px){.app{display:block}.sidebar{display:none}.main{padding:14px}}</style></head><body><div class="app"><aside class="sidebar"><strong>AI自动后台</strong><nav id="quickNav"></nav></aside><main class="main"><header class="topbar"><div><h1>FB Page 发布记录</h1><p>Graph对象ID仅表示视频提交被接受；完成只以对账状态为准。待确认和未知结果永不自动重发。</p></div><div class="actions"><div id="userCard"></div><a class="button" href="/fb-auto-publish-templates.html">模板管理</a><button id="refreshPage" class="button">刷新</button><button id="authButton" class="button">登录</button></div></header><section id="loginGate" class="panel hidden">请先登录。</section><section id="permissionGate" class="panel hidden">当前账号没有 fb_page_posts 权限。</section><div id="pageRoot" class="hidden"><section class="panel"><div class="topbar"><h2>运行列表 · 北京时间（UTC+8）</h2><button id="reload" class="button">刷新</button></div><p>批次会提前生成；请按“计划发布时间”判断发布日期，批次创建时间不代表实际发布时间。“完成时间”表示本批次结束，发布结果以详情中的对账状态为准。</p><div class="table-wrap"><table><thead><tr><th>计划发布时间</th><th>批次创建时间</th><th>完成时间</th><th>模板</th><th>触发</th><th>Page统计</th><th>任务</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></div><dialog id="detail"><div class="topbar"><h2>运行详情</h2><button id="close" class="button">关闭</button></div><pre id="detailBody"></pre></dialog><script src="/ui-topbar.js"></script><script src="/quick-nav.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id);let auth={};const api=async p=>{const r=await fetch(p,{credentials:"same-origin",cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||"请求失败");return d};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const beijingTime=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});const formatTime=value=>{if(!value)return "—";const date=new Date(value);return Number.isNaN(date.getTime())?"时间格式异常":beijingTime.format(date)};async function load(){const d=await api("/api/admin/fb-auto-publish/runs?limit=200&offset=0");$("rows").innerHTML=(d.items||[]).map(r=>`<tr><td>${esc(formatTime(r.planned_publish_at_utc))}</td><td>${esc(formatTime(r.created_at_utc))}</td><td>${esc(formatTime(r.completed_at_utc))}</td><td>${esc(r.name)} v${r.template_version}</td><td>${r.trigger_type==="auto"?"自动":"手动"}</td><td>总${r.total_pages} / 可发${r.publishable_pages} / 缺${r.missing_token_pages}</td><td>排队${r.queued_tasks} / 跳过${r.skipped_tasks}</td><td><span class="badge">${esc(r.status)}</span></td><td><button class="button" data-id="${r.id}">详情</button></td></tr>`).join("")||'<tr><td colspan="9">暂无记录</td></tr>'}async function shell(){try{auth=await api("/api/ui/topbar")}catch{auth={authenticated:false}}await QuickNav.render({container:"#quickNav",auth,activeKey:"fbAutoPublishRuns"});UiTopbar.render({auth,userCard:"#userCard",authButton:"#authButton",refreshButton:"#refreshPage"});$("authButton").onclick=()=>UiTopbar.handleAuthAction({auth,api});if(!auth.authenticated){$("loginGate").classList.remove("hidden");return}const u=auth.user||{};if(!(u.is_admin||(u.permissions&&u.permissions.fb_page_posts))){$("permissionGate").classList.remove("hidden");return}$("pageRoot").classList.remove("hidden");await load()}$("rows").onclick=async e=>{const id=e.target.dataset.id;if(!id)return;try{const d=await api(`/api/admin/fb-auto-publish/runs/${id}`);$("detailBody").textContent=`北京时间（UTC+8）\n计划发布时间：${formatTime(d.run.planned_publish_at_utc)}\n批次创建时间：${formatTime(d.run.created_at_utc)}\n完成时间：${formatTime(d.run.completed_at_utc)}\n\n原始运行数据（*_utc 字段为 UTC）：\n${JSON.stringify(d.run,null,2)}`;$("detail").showModal()}catch(err){alert(err.message)}};$("close").onclick=()=>$("detail").close();$("reload").onclick=load;shell()})();</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>频道管理（新版） · TT 平台推广</title>
  <link rel="stylesheet" href="/ui-topbar.css">
  <link rel="stylesheet" href="/tt-promotion.css?v=20261126a">
  <script defer src="/ui-topbar.js"></script>
  <script defer src="/quick-nav.js"></script>
  <script defer src="/tt-promotion-common.js"></script>
  <script defer src="/tt-promotion-first-use.js?v=20261126a"></script>
  <script defer src="/tt-promotion-channels.js?v=20261126b"></script>
</head>
<body class="tt-directory">
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">AI</div><div><strong>AI自动后台</strong><span>ai.yingliangads.com</span></div></div><button id="nav-toggle" type="button" class="button" aria-controls="quickNav" aria-expanded="false">展开后台导航</button><nav id="quickNav" aria-label="后台导航"></nav></aside>
  <main class="main">
    <header class="topbar"><div class="title"><p class="breadcrumb">TT 平台推广 / DramaWave</p><h1>频道管理（新版）</h1></div>
      <div class="top-actions"><div id="userCard" class="user-card"></div><button class="button" id="refreshPage">刷新</button><button class="button" id="authButton">登录</button></div>
    </header>
    <div role="alert" id="notice" hidden></div>
    <div role="status" id="loading">正在加载…</div>
    <section id="workspace" hidden>
      <div class="directory-overview" id="directory-overview" aria-label="全部频道概览">
        <button type="button" data-scope="" aria-pressed="true"><span>全部频道</span><strong>—</strong></button>
        <button type="button" data-scope="ready" aria-pressed="false"><span>可发布</span><strong>—</strong></button>
        <button type="button" data-scope="first" aria-pressed="false"><span>待选观看范围</span><strong>—</strong></button>
        <button type="button" data-scope="restricted" aria-pressed="false"><span>账号受限</span><strong>—</strong></button>
      </div><section class="panel">
      <div class="section-head"><div><h2>全部 TT 频道</h2><span id="list-meta" class="muted"></span></div><div class="actions"><button id="bulk" class="button" disabled>批量设置</button><button id="new-for-selected" class="button primary" disabled>用所选频道建模板</button></div></div>
      <div id="list-identity-error" class="module-error" hidden></div>
      <div id="list-profile-error" class="module-error" hidden></div>
      <div id="list-handoff-error" class="module-error" hidden></div>
      <form id="filters" class="filters channel-filters">
        <label class="channel-search">频道<input name="search" type="search" placeholder="昵称或账号 ID"></label>
        <label>剧语言<select name="language"><option value="">全部语言</option></select></label>
        <label>排序<select name="sort"></select></label>
        <button id="filter-toggle" class="button" type="button" aria-expanded="false" aria-controls="advanced-filters">更多筛选</button>
        <button class="row-link" type="reset">重置</button>
        <div id="advanced-filters" hidden>
        <label>发布资格<select name="eligible"><option value="">全部</option><option value="yes">可发布</option><option value="no">受限</option></select></label>
        <label>新版参与<select name="participating"><option value="">全部</option><option value="yes">已参与</option><option value="no">已暂停</option></select></label>
        <label>收入画像<select name="profile"><option value="">全部</option><option value="yes">有收入画像</option><option value="no">暂无画像</option></select></label>
        <label>第一受众<select name="audience"><option value="">全部受众</option></select></label>
        <label>旧排期与在途<select name="legacy"><option value="">全部</option><option value="yes">有旧排期或在途</option><option value="no">无旧排期和在途</option><option value="unknown">待核验</option></select></label>
        <div id="channel-range-fields" class="channel-range-fields"></div>
        </div>
      </form>
      <div id="selected-strip" class="selection-strip" hidden><span id="selected-summary"></span><button id="first-for-selected" class="row-link" type="button" hidden>确认观看范围</button><button id="review-selection" class="row-link" type="button">查看所选频道</button><button id="clear-selection" class="row-link" type="button">清空选择</button></div>
      <div id="channel-summary" class="channel-summary" role="status"></div>
      <div class="mobile-only mobile-checkbox"><label><input id="select-mobile" type="checkbox"> 选择当前结果</label></div>
      <div class="table-wrap channel-table"><table><thead><tr><th><input id="select-all" type="checkbox" aria-label="选择当前结果"></th><th>频道 / 剧语言</th><th>运营统计<small>北京时间</small></th><th>28 天 / 累计收入<small>美元 · UTC</small></th><th>收入画像<small>受众 · 占频道累计收入</small></th><th>优势题材<small>占第一受众收入</small></th><th>排期与在途</th><th>发布状态</th></tr></thead><tbody id="channels"></tbody></table></div>
    </section></section>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog" class="modal-head"><h2 id="dialog-title"></h2><button class="button" value="cancel" aria-label="关闭">关闭</button></form><div id="dialog-content"></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><div class="modal-head"><h2 id="confirm-title">确认操作</h2></div><p id="confirm-text"></p><div class="modal-foot"><button class="button" id="confirm-cancel">返回</button><button class="button primary" id="confirm-apply">确认</button></div></dialog>
</body>
</html>

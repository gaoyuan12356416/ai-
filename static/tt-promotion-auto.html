<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自动发布（新版） · TT 平台推广</title>
  <link rel="stylesheet" href="/ui-topbar.css">
  <link rel="stylesheet" href="/tt-promotion.css?v=20261126a">
  <link rel="stylesheet" href="/tt-promotion-auto-tools.css?v=20261126list">
  <script defer src="/ui-topbar.js"></script>
  <script defer src="/quick-nav.js"></script>
  <script defer src="/tt-promotion-common.js"></script>
  <script defer src="/tt-promotion-first-use.js?v=20261126a"></script>
  <script defer src="/tt-promotion-auto.js?v=20261126list"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">AI</div><div><strong>AI自动后台</strong><span>ai.yingliangads.com</span></div></div><button id="nav-toggle" type="button" class="button" aria-controls="quickNav" aria-expanded="false">展开后台导航</button><nav id="quickNav" aria-label="后台导航"></nav></aside>
  <main class="main">
    <header class="topbar"><div class="title"><p class="breadcrumb">TT 平台推广 / DramaWave</p><h1>自动发布（新版）</h1></div>
      <div class="top-actions"><div id="userCard" class="user-card"></div><button class="button" id="refreshPage">刷新</button><button class="button" id="authButton">登录</button></div>
    </header>
    <div role="alert" id="notice" hidden></div>
    <div role="status" id="loading">正在加载…</div>
    <section id="workspace" hidden><div id="channel-source-error" aria-live="polite"></div><div id="template-source-error" aria-live="polite"></div><section id="editor-view" hidden></section><div id="list-view"><nav class="tabs" aria-label="自动发布视图"><button class="tab selected" data-view="templates" aria-current="page">发布模板</button><button class="tab" data-view="runs">运行记录</button></nav>
    <section id="templates-view">
      <div class="template-totals" aria-label="模板统计">
        <div><span>模板总数</span><strong id="template-total">—</strong></div>
        <div><span>已启用</span><strong id="template-enabled">—</strong></div>
        <div><span>已停用</span><strong id="template-disabled">—</strong></div>
        <div><span>运行中</span><strong id="template-running">—</strong></div>
      </div>
      <section class="panel">
        <div class="section-head"><h2>模板列表</h2><div class="actions"><button class="button" type="button" id="refresh-templates">刷新列表</button><button class="button primary" id="new-template">创建模板</button></div></div>
        <form class="tool-filters template-filters" id="template-filters">
          <label>模板名称<input type="search" id="template-search" placeholder="名称或模板 ID"></label>
          <label>模板状态<select id="template-enabled-filter" aria-label="模板状态"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select></label>
          <label>最近批次<select id="template-state"><option value="">全部结果</option><option value="anomaly">有异常</option><option value="failed">有失败</option><option value="skipped">有跳过</option><option value="review">待核对</option></select></label>
          <button class="button" type="reset">重置</button>
        </form>
        <div id="stats-error" aria-live="polite"></div>
        <div class="table-wrap template-table"><table><thead><tr><th>模板</th><th>状态</th><th>频道</th><th>发布时间</th><th>两层排序</th><th>下次执行</th><th>最近运行</th><th title="最近编辑或启停模板的人员">操作人</th><th>操作</th></tr></thead><tbody id="templates"></tbody></table></div>
        <div class="template-footer"><span id="templates-meta" class="muted"></span><div id="template-pages" class="tool-pages"></div></div>
      </section>
    </section>
    <section id="runs-view" class="panel" hidden><div class="section-head"><h2>运行记录</h2><span id="history-total" class="muted"></span></div>
      <form id="history-filters" class="tool-filters">
        <label>模板<select name="template_id" id="run-filter"><option value="">全部模板</option></select></label>
        <label>频道<select name="account_id" id="history-channel"><option value="">全部频道</option></select></label>
        <label>状态<select name="status"><option value="">全部状态</option><option value="failed">失败</option><option value="review">待核对</option><option value="skipped">跳过</option><option value="pending">进行中</option><option value="confirmed">已确认</option></select></label>
        <label>触发方式<select name="trigger_type"><option value="">全部触发</option><option value="auto">自动</option><option value="manual">手动</option></select></label>
        <label>起始日期（北京）<input type="date" name="start"></label><label>截止日期（北京）<input type="date" name="end"></label>
        <div class="actions"><button class="button primary" type="submit" id="refresh-runs">查询记录</button><button class="button" type="reset">重置</button></div>
      </form>
      <div id="history-error" role="status"></div>
      <div class="table-wrap"><table><thead><tr><th>批次 / 模板</th><th>触发方式</th><th>排期 / 创建时间</th><th>状态</th><th>任务统计</th><th>操作</th></tr></thead><tbody id="runs"></tbody></table></div>
      <div id="history-pages" class="tool-pages"></div>
    </section></div></section>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog" class="modal-head"><h2 id="dialog-title"></h2><button class="button" value="cancel" aria-label="关闭">关闭</button></form><div id="dialog-content"></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><div class="modal-head"><h2 id="confirm-title">确认操作</h2></div><p id="confirm-text"></p><div class="modal-foot"><button class="button" id="confirm-cancel">返回</button><button class="button primary" id="confirm-apply">确认</button></div></dialog>
</body>
</html>

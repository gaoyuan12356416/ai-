<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短剧付费 TOP100 · AI 自动后台</title>
  <link rel="stylesheet" href="/youtube-publish.css?v=20260917-player-badges-v1">
  <link rel="stylesheet" href="/ui-topbar.css">
  <link rel="stylesheet" href="/drama-pay-rank.css?v=20261113c">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/">
      <div class="brand-mark">剧</div>
      <div><strong>AI自动后台</strong><small>内容制作与发布管理</small></div>
    </a>
    <nav id="quickNav" class="nav" aria-label="后台主导航"></nav>
    <div class="sidebar-note"><strong>数据报表</strong><span>短剧付费榜单</span></div>
  </aside>
  <main class="main rank-main">
    <header class="topbar">
      <div>
        <div class="rank-eyebrow">DRAMA · RANKING</div>
        <h1>短剧付费 TOP100</h1>
        <p>按语种查看近三日付费人数排名</p>
      </div>
      <div class="toolbar">
        <div id="userCard" class="user-card"></div>
        <button id="loginBtn" class="btn btn-secondary" type="button">登录</button>
        <button id="refreshBtn" class="btn btn-secondary" type="button">刷新页面</button>
      </div>
    </header>
    <section class="rank-panel" aria-labelledby="rankHeading">
      <div class="rank-panel-head">
        <h2 id="rankHeading">每日榜单</h2>
        <p>每天北京时间 11:00 更新</p>
      </div>
      <form id="filters" class="rank-filters" aria-label="榜单筛选">
        <label class="rank-filter" for="dateFilter">榜单日期<select id="dateFilter"><option value="">最新榜单</option></select></label>
        <label class="rank-filter" for="languageFilter">语种<select id="languageFilter"><option value="en">英语 · en</option></select></label>
        <button class="btn btn-primary" type="submit">查看榜单</button>
      </form>
      <div class="rank-meta"><span id="windowLabel">正在加载…</span><span id="updatedLabel"></span><span id="countLabel"></span></div>
      <div id="notice" class="rank-notice" role="status" hidden></div>
      <div class="rank-table-wrap" tabindex="0" role="region" aria-label="可横向滚动的榜单明细">
        <table class="rank-table">
          <thead><tr><th scope="col">排名</th><th scope="col">短剧 / 剧 ID</th><th scope="col">语种</th><th scope="col">受众</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="empty">正在读取榜单…</td></tr></tbody>
        </table>
      </div>
      <footer class="rank-footnote">排名依据榜单生成日前三个完整 UTC 自然日的去重付费人数；接口仅提供名次。支付关联的剧不等同于专为该剧解锁付费。</footer>
    </section>
  </main>
</div>
<script src="/quick-nav.js?v=20261113rank1"></script>
<script src="/ui-topbar.js"></script>
<script src="/drama-pay-rank.js?v=20261113a"></script>
</body>
</html>

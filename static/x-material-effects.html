<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X 素材效果 · 数据报表</title>
  <link rel="stylesheet" href="/youtube-publish.css?v=20260917-player-badges-v1">
  <link rel="stylesheet" href="/ui-topbar.css?v=20260903-1">
  <link rel="stylesheet" href="/social-analytics.css?v=20261020-facebook-v2">
  <link rel="stylesheet" href="/x-material-effects.css?v=70f9da826db2">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">剧</div><div><strong>AI自动后台</strong><small>内容制作与发布管理</small></div></div>
      <nav id="quickNav" class="nav" aria-label="后台主导航"></nav>
    </aside>
    <main class="main analytics-main">
      <header class="topbar">
        <div><h1>X 素材效果</h1><p>按素材汇总 X 全部账号的累计表现，点击素材查看帖子明细。</p></div>
        <div class="toolbar">
          <div class="user-card" id="userCard"></div>
          <button type="button" class="btn btn-secondary" id="authButton">登录</button>
          <button type="button" class="btn btn-secondary" id="refreshPage">刷新数据</button>
        </div>
      </header>

      <form id="filters" class="analytics-panel filter-panel effects-filters">
        <label>素材／剧目<input name="q" type="search" placeholder="ID 或名称"></label>
        <label>产品<input name="product" placeholder="全部产品" size="14"></label>
        <label>语言<input name="language" placeholder="全部语言" size="10"></label>
        <label>账号 ID<input name="account_id" placeholder="全部账号" size="12"></label>
        <label>发布开始日期<input type="date" name="start"></label>
        <label>发布结束日期<input type="date" name="end"></label>
        <button class="btn btn-primary" type="submit">查询</button>
        <button class="btn btn-secondary" type="reset">重置</button>
      </form>
      <p class="scope-strip">按北京时间筛选帖子发布日期。指标为所选帖子的最新累计值。浏览量为曝光次数，分享量为转发与引用之和，收入截止日期采用 UTC。</p>
      <div id="notice" class="analytics-message warning hidden" role="status" aria-live="polite"></div>
      <div class="kpi-grid effects-summary" id="summary"></div>
      <section class="analytics-panel" aria-label="素材效果明细">
        <div id="freshness" class="effects-freshness"></div>
        <div class="analytics-table-scroll" tabindex="0" aria-label="素材效果表格">
          <table class="analytics-table">
            <thead><tr>
              <th scope="col" class="plain-heading">素材／剧目</th>
              <th scope="col"><button type="button" data-sort="post_count">发布数</button></th>
              <th scope="col"><button type="button" data-sort="account_count">账号数</button></th>
              <th scope="col" aria-sort="descending"><button type="button" data-sort="views" class="sorted">浏览量</button></th>
              <th scope="col"><button type="button" data-sort="likes">点赞</button></th>
              <th scope="col"><button type="button" data-sort="comments">评论</button></th>
              <th scope="col"><button type="button" data-sort="shares">分享</button></th>
              <th scope="col"><button type="button" data-sort="bookmarks">收藏</button></th>
              <th scope="col"><button type="button" data-sort="revenue_cents">收入 USD</button></th>
              <th scope="col" class="plain-heading">采集时间</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="report-pagination"><span id="count"></span><div>
          <button type="button" class="btn btn-secondary btn-sm" id="prev" disabled>上一页</button>
          <button type="button" class="btn btn-secondary btn-sm" id="next" disabled>下一页</button>
        </div></div>
      </section>
      <dialog id="detail" aria-labelledby="detailTitle">
        <div class="detail-head"><h2 id="detailTitle">帖子效果明细</h2><button type="button" class="btn btn-secondary" id="closeDetail">关闭</button></div>
        <div id="detailBody"></div>
      </dialog>
    </main>
  </div>
  <script src="/quick-nav.js?v=43969bd46e10"></script>
  <script src="/ui-topbar.js?v=db2d3427364e"></script>
  <script src="/x-material-effects.js?v=95c878f62d83"></script>
</body>
</html>

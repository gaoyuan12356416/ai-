# Dedicated volatile cache for the public TT code resolver.
# SQLite remains authoritative; this instance deliberately has no persistence.

bind 127.0.0.1
protected-mode yes
port 6381
tcp-backlog 128
timeout 0
tcp-keepalive 300

daemonize no
supervised no
pidfile /run/tt-code-redis/redis.pid
loglevel notice
logfile ""

databases 1
save ""
stop-writes-on-bgsave-error no
appendonly no
dir /mnt/data-disk/tt-post-publisher/redis
dbfilename dump.rdb

maxmemory 128mb
maxmemory-policy allkeys-lru

# This cache is private to the TT sidecar and never needs administrative
# mutation commands at runtime.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

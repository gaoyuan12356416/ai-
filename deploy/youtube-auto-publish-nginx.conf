# Included by the existing ai.yingliangads.com server block.
# Authentication, ownership and approval checks stay in the application.
location ^~ /api/youtube-auto-publish/ {
    client_max_body_size 3m;
    client_body_timeout 15s;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # The application owns no-store JSON and private, revalidated cover caching.
    proxy_cache off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json;
    gzip_vary on;
}

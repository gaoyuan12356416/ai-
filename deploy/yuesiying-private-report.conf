location = /reports/yuesiying { return 302 /reports/yuesiying/; }
location ^~ /reports/yuesiying/ {
    auth_request /_yuesiying_owner_auth;
    error_page 401 = @yuesiying_owner_login;
    error_page 403 = @yuesiying_owner_forbidden;
    alias /mnt/data-disk/codex-artifacts/yuesiying-low-language-20261103/site/;
    index index.html;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types application/json text/css application/javascript;
}
location = /_yuesiying_owner_auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/report-auth/yuesiying;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Token "";
    proxy_set_header Host $host;
}
location = /api/report-auth/yuesiying {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Token "";
}
location @yuesiying_owner_login {
    return 302 /api/auth/feishu/login?next=/reports/yuesiying/;
}
location @yuesiying_owner_forbidden {
    default_type text/html;
    charset utf-8;
    return 403 '<!doctype html><meta charset="utf-8"><h1>无权访问</h1><p>此报表仅限指定飞书账号使用。</p>';
}

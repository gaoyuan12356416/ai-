# Install as /etc/tmpfiles.d/tt-auto-post.conf, then run:
# systemd-tmpfiles --create /etc/tmpfiles.d/tt-auto-post.conf
# The SQLite state stays private; only the dedicated immutable short-link tree
# is traversable by Nginx.
d /mnt/data-disk/tt-auto-post-publisher 0700 tt-post tt-post -
d /mnt/data-disk/tt-auto-post-public 0755 tt-post tt-post -
d /mnt/data-disk/tt-auto-post-public/s2l 0755 tt-post tt-post -
d /mnt/data-disk/tt-auto-post-public/s2l/tt-auto 0755 tt-post tt-post -

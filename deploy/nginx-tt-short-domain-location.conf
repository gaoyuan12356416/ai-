# Insert this location before the generic numeric /s2l/ location in the
# existing gy.g2flow.com TLS server. The fixed 19-digit 8-prefix is reserved
# for TikTok organic-post wrappers; historical and future X wrappers keep
# using the existing X data root and URL path.
location ~ "^/s2l/8[0-9]{18}[.]html$" {
    root /mnt/data-disk/tt-post-publisher;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

# New TT automatic links use the queue auto-increment ID below /s2l/tt/.
# Historical fixed 19-digit TT links keep their original route. X wrappers
# continue using the separate generic numeric /s2l/{id}.html route and root.
# Include this snippet before the generic numeric /s2l/ location.
location ~ "^/s2l/tt/[1-9][0-9]{0,18}[.]html$" {
    root /mnt/data-disk/tt-post-publisher;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

location ~ "^/s2l/8[0-9]{18}[.]html$" {
    root /mnt/data-disk/tt-post-publisher;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

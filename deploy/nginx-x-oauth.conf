# Include inside the ai.yingliangads.com server block (currently via default.d).
# Only OAuth callback/health and immutable numeric short-link files are public.
# Sidecar /internal/* routes must remain loopback-only.
location = /x-oauth/callback {
    # The query contains one-time OAuth code/state values; never persist it.
    access_log off;
    proxy_pass http://127.0.0.1:8810/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /x-oauth/health {
    proxy_pass http://127.0.0.1:8810/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /x-oauth/ {
    return 404;
}

location = /x-account-list.html {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

location = /x-post-material-pool.html {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

location = /x-post-drama-pool.html {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

location = /tt-post-pool.html {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires -1;
}

# Material preview is validation-only. GPU preparation runs asynchronously
# after pool admission, so this route must retain a short bounded timeout.
location = /api/admin/tt-posts/materials/preview {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}

location ^~ /s2l/ {
    root /mnt/data-disk/x-post-automation;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}


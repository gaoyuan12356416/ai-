# Include inside the site server block via /etc/nginx/default.d/.
# The HTML selects a versioned script; always fetch the current HTML entry.
location = /x-post-logs.html {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

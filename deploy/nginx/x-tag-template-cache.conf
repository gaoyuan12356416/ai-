# The editor HTML selects the versioned script. Reusing old HTML also reuses
# an immutable old script, even after a successful account-policy deployment.
location = /x-tag-auto-publish-template.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
}

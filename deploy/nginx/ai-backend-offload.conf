# Only existing GET read endpoints. Business mutation endpoints retain their routes.
location = /api/social-analytics/options {
    proxy_pass http://127.0.0.1:19962;
    proxy_read_timeout 45s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/social-analytics/report {
    proxy_pass http://127.0.0.1:19962;
    proxy_read_timeout 45s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/social-analytics/export.csv {
    proxy_pass http://127.0.0.1:19962;
    proxy_read_timeout 45s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# This independent loopback proxy does not share the website's worker pool.
worker_processes 1;
pid /run/ai-offload-sql-control/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /run/ai-offload-sql-control/body;
    proxy_temp_path /run/ai-offload-sql-control/proxy;
    fastcgi_temp_path /run/ai-offload-sql-control/fastcgi;
    uwsgi_temp_path /run/ai-offload-sql-control/uwsgi;
    scgi_temp_path /run/ai-offload-sql-control/scgi;
    include /etc/ai-backend-offload-sql-control/server.conf;
}

# server context: /etc/nginx/default.d/ai-site-performance.conf
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_types text/css application/javascript text/javascript image/svg+xml;

# Only root-level public code assets. API, report JSON and HTML cache policies
# continue to be defined by their existing locations.
location ~ ^/[^/]+\.(?:js|css)$ {
    add_header Cache-Control $ai_static_cache_control;
    try_files $uri =404;
}

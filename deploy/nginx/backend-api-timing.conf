# http context; omit query strings, cookies, bodies and user identifiers.
map "$server_name:$uri" $backend_api_timing_enabled {
    default 0;
    ~^ai\.yingliangads\.com:/api/ 1;
}
log_format backend_api_timing escape=json
    '{"at":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time",'
    '"upstream_header_seconds":"$upstream_header_time"}';
access_log /mnt/data-disk/backend-performance/api-timing.log backend_api_timing
    buffer=64k flush=5s if=$backend_api_timing_enabled;

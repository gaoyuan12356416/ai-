# Public TikTok organic bridge. Keep the exact short path queryless so the
# browser retains incoming tracking parameters for the client-side handoff.
location = /tt {
    alias /usr/share/nginx/html/tt-drama-search.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ads-cdn.yingliang.tech data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location = /tt-drama-search.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Public TikTok organic bridge. Keep the exact short path queryless so the
# browser retains incoming tracking parameters for the client-side handoff.
location = /tt {
    alias /usr/share/nginx/html/tt-drama-search.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ads-cdn.yingliang.tech https://cdn.usrgrow.com https://static.mydramawave.com https://static-v1.mydramawave.com https://static-v2.mydramawave.com data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self' https://static-v1.mydramawave.com https://static-v2.mydramawave.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location = /api/public/tt-drama/resolve {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location = /tt-drama-search.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

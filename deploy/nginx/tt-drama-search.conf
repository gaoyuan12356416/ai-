# Primary public TikTok organic bridge. /tt-code remains as a compatibility
# entry point, while both paths load the same code-aware multilingual page.
location = /tt {
    alias /usr/share/nginx/html/tt-drama-code-locales/$tt_drama_code_locale.html;
    default_type text/html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    add_header Cache-Control "no-store" always;
    add_header Content-Language $tt_drama_code_locale always;
    add_header Pragma "no-cache" always;
    add_header Vary "Accept-Language" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ads-cdn.yingliang.tech https://cdn.usrgrow.com https://static.mydramawave.com https://static-v1.mydramawave.com https://static-v2.mydramawave.com data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    limit_except GET {
        deny all;
    }
}

location = /api/public/tt-drama/resolve {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location = /api/public/tt-drama/featured {
    alias /mnt/data-disk/tt-drama-featured/public/current.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

location = /tt-drama-search.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

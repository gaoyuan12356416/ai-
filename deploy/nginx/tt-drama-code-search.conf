# Compatibility entry point for the code-aware multilingual bridge. The
# primary public path is /tt and is declared in tt-drama-search.conf.
location = /tt-code {
    alias /usr/share/nginx/html/tt-drama-code-locales/$tt_drama_code_locale.html;
    default_type text/html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    add_header Cache-Control "no-store" always;
    add_header Content-Language $tt_drama_code_locale always;
    add_header Pragma "no-cache" always;
    add_header Vary "Accept-Language" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ads-cdn.yingliang.tech https://cdn.usrgrow.com https://static.mydramawave.com https://static-v1.mydramawave.com https://static-v2.mydramawave.com data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    limit_except GET {
        deny all;
    }
}

location = /tt-drama-code-search.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

# Content-addressed production asset. The unversioned script above remains as
# a no-store rollback/development path.
location ~ "^/tt-drama-code-assets/tt-drama-code-search\.[a-f0-9]{12}\.js$" {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

# Content-addressed code-location guide used by the search card. Keep the
# exact path immutable so locale HTML can reference one same-origin image.
location = /tt-drama-code-assets/tt-code-location-guide.0b42fbc64ab4.webp {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

location = /api/public/tt-drama/featured-by-language {
    alias /mnt/data-disk/tt-drama-featured/public/current-by-language.json;
    default_type application/json;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

# Each path maps to one offline-generated five-story ranking. The capture does
# not permit slashes, dots or encoded traversal, and a missing language file is
# a normal 404 handled by the page fallback.
location ~ "^/api/public/tt-drama/featured-by-language/(?<tt_featured_language>[a-z]{2,3}(?:-[a-z0-9]{2,8})?)\.json$" {
    alias /mnt/data-disk/tt-drama-featured/public/by-language/$tt_featured_language.json;
    default_type application/json;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

# Optional same-origin thumbnail cache. The immutable name is derived from the
# source bytes and transform version; originals remain in JSON as the fallback.
location ~ "^/tt-featured-covers/(?<tt_featured_cover_hash>[a-f0-9]{64})\.webp$" {
    alias /mnt/data-disk/tt-drama-featured/public/covers/$tt_featured_cover_hash.webp;
    default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

location = /api/public/tt-code/resolve {
    # The main API applies the existing public DramaWave content validation,
    # per-client token bucket and in-flight gate, then calls the TT sidecar
    # over its bearer-protected loopback route.
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

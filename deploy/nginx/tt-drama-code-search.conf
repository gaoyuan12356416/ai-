# Independent TT short-code bridge. Keep these exact locations separate from
# the legacy /tt page and its resolver contract.
location = /tt-code {
    alias /usr/share/nginx/html/tt-drama-code-search.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ads-cdn.yingliang.tech https://cdn.usrgrow.com https://static.mydramawave.com https://static-v1.mydramawave.com https://static-v2.mydramawave.com data:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    limit_except GET {
        deny all;
    }
}

location = /tt-drama-code-search.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

location = /api/public/tt-code/resolve {
    proxy_pass http://127.0.0.1:18829;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_except GET {
        deny all;
    }
}

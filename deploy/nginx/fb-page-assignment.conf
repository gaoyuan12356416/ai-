# This exact route is owned by the independent assignment service.
# The service checks its own Bearer token; publishing and main API stay running.
location = /api/integrations/v1/drama-page-assignments {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8943;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 120s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

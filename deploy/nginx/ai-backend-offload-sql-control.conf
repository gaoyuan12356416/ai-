# Install under the independent relay, not the website's conf.d directory.
# Loopback HTTP transport only. The existing SQL gate remains the sole
# authority for authentication, occupancy, statement rate and lease release.
# Nginx keeps the SSH channel open while the unchanged gate closes its local
# HTTP responses. No upstream retry is allowed for ambiguous admissions.
server {
    listen 127.0.0.1:19982;
    server_name localhost;
    access_log off;
    client_max_body_size 8k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    location ~ ^/v1/(lease/(acquire|begin|bind|heartbeat|query|release)|status)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:19970;
        proxy_set_header Connection close;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_send_timeout 4s;
        proxy_next_upstream off;
        proxy_buffering off;
    }

    location / { return 404; }
}

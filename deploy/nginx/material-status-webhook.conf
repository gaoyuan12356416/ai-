# Public partner webhook. Authorization is enforced by the application with a
# dedicated Bearer Token. Source IP is forwarded for audit only.
location = /api/integrations/v1/material-task-status-events {
    client_max_body_size 32k;
    error_page 413 = @material_status_webhook_payload_too_large;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location @material_status_webhook_payload_too_large {
    internal;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 413 '{"code":"payload_too_large","message":"请求体超过 32 KiB"}';
}

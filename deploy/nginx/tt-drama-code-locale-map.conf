# Install this file in /etc/nginx/conf.d, where `map` is valid in the http
# context. Do not install it in /etc/nginx/default.d (server context).
#
# The browser orders Accept-Language by preference. Only the first language is
# used for the static first paint, and every result is a fixed allowlisted file
# name. Unsupported or malformed values fail closed to English.
map $http_accept_language $tt_drama_code_locale {
    default en;

    "~*^[[:space:]]*zh-(tw|hk|mo|hant)(?:[-,;[:space:]]|$)" zh-tw;
    "~*^[[:space:]]*zh(?:[-,;[:space:]]|$)" zh-hans;
    "~*^[[:space:]]*(fil|tl)(?:[-,;[:space:]]|$)" tl;
    "~*^[[:space:]]*ar(?:[-,;[:space:]]|$)" ar;
    "~*^[[:space:]]*cs(?:[-,;[:space:]]|$)" cs;
    "~*^[[:space:]]*de(?:[-,;[:space:]]|$)" de;
    "~*^[[:space:]]*el(?:[-,;[:space:]]|$)" el;
    "~*^[[:space:]]*es(?:[-,;[:space:]]|$)" es;
    "~*^[[:space:]]*fr(?:[-,;[:space:]]|$)" fr;
    "~*^[[:space:]]*hi(?:[-,;[:space:]]|$)" hi;
    "~*^[[:space:]]*id(?:[-,;[:space:]]|$)" id;
    "~*^[[:space:]]*it(?:[-,;[:space:]]|$)" it;
    "~*^[[:space:]]*ja(?:[-,;[:space:]]|$)" ja;
    "~*^[[:space:]]*ko(?:[-,;[:space:]]|$)" ko;
    "~*^[[:space:]]*ms(?:[-,;[:space:]]|$)" ms;
    "~*^[[:space:]]*pl(?:[-,;[:space:]]|$)" pl;
    "~*^[[:space:]]*pt(?:[-,;[:space:]]|$)" pt;
    "~*^[[:space:]]*ro(?:[-,;[:space:]]|$)" ro;
    "~*^[[:space:]]*ru(?:[-,;[:space:]]|$)" ru;
    "~*^[[:space:]]*th(?:[-,;[:space:]]|$)" th;
    "~*^[[:space:]]*tr(?:[-,;[:space:]]|$)" tr;
    "~*^[[:space:]]*vi(?:[-,;[:space:]]|$)" vi;
}

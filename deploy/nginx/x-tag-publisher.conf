# Keep authenticated data private; compression does not enable response caching.
location ^~ /api/admin/x-tag-auto-publish {
 gzip on;
 gzip_comp_level 5;
 gzip_min_length 512;
 gzip_types application/json;
 gzip_vary on;
 gzip_proxied any;
 proxy_pass http://127.0.0.1:8898;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 150s;
 client_max_body_size 2m;
}
location ^~ /api/admin/x-tag-posts {
 gzip on;
 gzip_comp_level 5;
 gzip_min_length 512;
 gzip_types application/json;
 gzip_vary on;
 gzip_proxied any;
 proxy_pass http://127.0.0.1:8898;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 150s;
 client_max_body_size 2m;
}

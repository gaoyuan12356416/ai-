[Unit]
Description=Check refreshed social counts and send complete daily reports
# The timer controls retries. The old seven-start hourly limit also counted successful ticks.
StartLimitIntervalSec=0

[Service]
Type=oneshot
Restart=no
ExecStart=
ExecStart=/usr/bin/python3 -B /opt/youtube-publisher-daily-report/current/scripts/youtube_publisher_daily_report.py --publication-timezone UTC --poll
# Each date has a bounded collector. A delayed date may coexist with today's report.
TimeoutStartSec=infinity

# Install as /etc/nginx/conf.d/gy.g2flow.com.conf after the certificate exists.
# This hostname exposes only immutable numeric X-post short-link wrappers.
server {
    listen 80;
    listen [::]:80;
    server_name gy.g2flow.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://gy.g2flow.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gy.g2flow.com;

    ssl_certificate /etc/letsencrypt/live/gy.g2flow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gy.g2flow.com/privkey.pem;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    location ~ ^/s2l/[0-9]+[.]html$ {
        root /mnt/data-disk/x-post-automation;
        try_files $uri =404;
        autoindex off;
        limit_except GET {
            deny all;
        }
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location / {
        return 404;
    }
}

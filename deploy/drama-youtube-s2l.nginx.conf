# Include inside gy.g2flow.com TLS server before the generic /s2l route.
location ^~ /s2l/youtube/ {
    if ($uri !~ "^/s2l/youtube/[1-9][0-9]{0,18}[.]html$") { return 404; }
    root /mnt/data-disk/drama-youtube-short-links;
    try_files $uri =404;
    autoindex off;
    limit_except GET { deny all; }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

# The longer ^~ prefix wins over the existing broader /s2l route.
location ^~ /s2l/fb/ {
    if ($uri !~ "^/s2l/fb/[1-9][0-9]{0,18}[.]html$") {
        return 404;
    }
    root /mnt/data-disk/fb-auto-post-public;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

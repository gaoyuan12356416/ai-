# Install as /etc/tmpfiles.d/x-post-runtime.conf, then run:
# systemd-tmpfiles --create /etc/tmpfiles.d/x-post-runtime.conf
#
# These directories carry process-shared flock files.  No transient/oneshot
# service may own them through RuntimeDirectory=, because stopping one owner
# would unlink the directory and let another process lock a different inode at
# the same pathname.  Keep this shared runtime contract across X-auto rollback.
d /run/x-auto-post 0700 x-post-daily x-post-daily -
d /run/x-post-daily 0700 x-post-daily x-post-daily -

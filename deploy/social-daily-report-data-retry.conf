[Unit]
# 11:00 plus six five-minute retries; the normal daily timer remains unchanged.
StartLimitIntervalSec=3600
StartLimitBurst=7

[Service]
# This host has an older systemd that rejects Restart for oneshot services.
Type=simple
Restart=on-failure
RestartSec=300
# Unknown/failed message delivery (2) and code/config errors (1) are not retried.
# The compatible report entrypoint uses 75 only for incomplete collection.
RestartPreventExitStatus=1 2

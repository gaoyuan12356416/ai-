# Included by both existing AI-backend server blocks via default.d/*.conf.
# The application enforces cookie login, module permission and product ACL.
location ^~ /api/fb-post-ad-delete/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;
    # A failed mutating request must be reconciled by its request_id.
    proxy_next_upstream off;
    proxy_cache off;
}

location = /fb-post-ad-delete.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

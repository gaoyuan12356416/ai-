# Install as /etc/nginx/default.d/x-auto-post.conf.
# HTML is an authenticated admin shell whose own assets carry explicit
# cache-busters. Do not let a browser restore an older shell/asset mapping.
location = /x-auto-publish-templates.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location = /x-auto-publish-template.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location = /x-auto-publish-runs.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

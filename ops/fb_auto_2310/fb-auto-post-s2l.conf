# Preserve every existing /s2l/fb/{task_id}.html address and frozen source file.
location ^~ /s2l/fb/ {
    if ($uri !~ "^/s2l/fb/[1-9][0-9]{0,18}[.]html$") {
        return 404;
    }
    root /mnt/data-disk/fb-auto-post-public;
    try_files $uri =404;
    autoindex off;
    limit_except GET {
        deny all;
    }
    default_type text/html;
    # Authorized migration: rewrite only this exact landing-page path in all
    # HTML/JS redirect targets; the original query bytes remain unchanged.
    sub_filter 'https://www.dramawavew2a.com/ads/0/2049/view?' 'https://www.dramawavew2a.com/ads/101/2310/view?';
    sub_filter_once off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; navigate-to https://www.dramawavew2a.com; base-uri 'none'; frame-ancestors 'none'" always;
}

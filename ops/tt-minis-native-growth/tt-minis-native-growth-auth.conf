location = /reports/tt-minis-native-growth {
    return 301 /reports/tt-minis-native-growth/;
}

location ^~ /reports/tt-minis-native-growth/data/ {

    auth_request /_tt_minis_report_auth;
    error_page 401 = @tt_minis_report_login;
    error_page 403 = @tt_minis_report_forbidden;

    # The generated_at query parameter changes after every publish. Keep each
    # private, versioned daily detail response for 15 minutes so reopening the
    # report or switching between today/yesterday/3 days avoids repeat transfer.
    add_header Cache-Control "private, max-age=900" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;
    gzip_vary on;
    try_files $uri =404;
}

location ^~ /reports/tt-minis-native-growth/ {

    auth_request /_tt_minis_report_auth;
    error_page 401 = @tt_minis_report_login;
    error_page 403 = @tt_minis_report_forbidden;

    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;
    try_files $uri $uri/index.html /reports/tt-minis-native-growth/index.html;
}

location = /_tt_minis_report_auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/report-auth/tt-minis-native-growth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @tt_minis_report_login {
    return 302 /api/auth/feishu/login?next=/reports/tt-minis-native-growth/;
}

location @tt_minis_report_forbidden {
    default_type text/html;
    return 403 '<!doctype html><html><head><meta charset="utf-8"><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1><p>This report is only available to approved Feishu tenant users.</p></body></html>';
}

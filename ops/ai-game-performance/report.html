<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>AI游戏产品测转化报表</title>
  <style>
    :root{--ink:#182234;--muted:#64748b;--line:#dce4ef;--panel:#fff;--bg:#f3f6fa;--blue:#2563eb;--blue2:#dbeafe;--green:#0f9f6e;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;--shadow:0 8px 28px rgba(30,64,175,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer} header{position:sticky;top:0;z-index:20;background:linear-gradient(115deg,#0f1f3b,#173f7a 62%,#235ec0);color:#fff;box-shadow:0 4px 20px rgba(15,31,59,.2)}
    .head{max-width:1680px;margin:auto;padding:18px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between}.title h1{font-size:23px;margin:0 0 4px}.title p{margin:0;color:#dbeafe;font-size:12px}.actions{display:flex;gap:9px}.btn{border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:9px 14px}.btn.primary{background:#fff;color:#17418a;border-color:#fff;font-weight:700}.btn:disabled{opacity:.5;cursor:not-allowed}
    main{max-width:1680px;margin:auto;padding:18px 24px 36px}.notice{border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:11px 14px;color:#1e3a5f;margin-bottom:12px}.notice.warn{border-color:#fed7aa;background:#fff7ed;color:#7c2d12}.notice.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}.notice strong{font-weight:750}.small{font-size:12px;color:var(--muted)}
    .toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.toolbar{padding:14px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{min-width:130px}.field.grow{flex:1;min-width:220px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);padding:0 10px;outline:none}.field input:focus,.field select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}.preset-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px}.chip,.view-tab,.dim-chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 11px;color:#334155}.chip.active,.view-tab.active,.dim-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.view-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}.view-tabs,.dim-list{display:flex;gap:7px;flex-wrap:wrap}.view-tab{font-weight:700}.view-help{color:var(--muted);font-size:12px;margin-left:4px}.dim-wrap{border-top:1px dashed var(--line);padding-top:11px;margin-top:11px}.dim-title{font-size:12px;color:var(--muted);margin-right:4px}
    .cards{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;min-height:86px;box-shadow:var(--shadow)}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:23px;font-weight:780;margin:6px 0 2px;letter-spacing:-.4px}.card .hint{font-size:11px;color:#94a3b8}.card.blue{border-top:3px solid var(--blue)}.card.green{border-top:3px solid var(--green)}.card.orange{border-top:3px solid var(--orange)}.card.purple{border-top:3px solid var(--purple)}
    .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.panel{padding:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.panel-head h2{font-size:16px;margin:0}.status{color:var(--muted);font-size:12px}.trend{height:190px;overflow:hidden}.trend svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:620px}table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf1f6;text-align:right;font-variant-numeric:tabular-nums}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:12px;z-index:3}th:first-child,td:first-child{text-align:left}tbody tr:hover{background:#f8fbff}.left{text-align:left!important}.empty{padding:42px!important;text-align:center!important;color:var(--muted)}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}.pager button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px}.quality{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.quality span{padding:4px 8px;border-radius:7px;background:#f1f5f9}.quality .ok{background:#ecfdf5;color:#047857}.quality .warn{background:#fff7ed;color:#c2410c}
    @media(max-width:1180px){.cards{grid-template-columns:repeat(4,minmax(145px,1fr))}}@media(max-width:720px){.head{padding:14px 15px;align-items:flex-start}.title h1{font-size:18px}.title p{max-width:220px}.actions{flex-direction:column}.actions .btn{padding:7px 9px}main{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:78px}.card .value{font-size:19px}.field,.field.grow{min-width:calc(50% - 6px);flex:1}.view-row{align-items:flex-start}.panel{padding:11px}.trend{height:165px}}@media(max-width:420px){.field,.field.grow{min-width:100%}.cards{grid-template-columns:1fr 1fr}.card{padding:11px}.title p{display:none}}
  </style>
</head>
<body>
<header><div class="head"><div class="title"><h1>AI游戏产品测转化报表</h1><p id="metaLine">正在读取最新私有快照…</p></div><div class="actions"><button class="btn" id="refreshBtn">刷新索引</button><button class="btn primary" id="exportBtn" disabled>导出当前 CSV</button></div></div></header>
<main>
  <div class="notice" id="sourceNotice">渠道事实与产品测转化分开汇总后合并；多游戏或未归属渠道数据不会被猜测分摊。</div>
  <div class="notice warn" id="qualityNotice" hidden></div>
  <section class="toolbar">
    <div class="row">
      <div class="field"><label for="startDate">开始日期</label><input id="startDate" type="date"></div>
      <div class="field"><label for="endDate">结束日期</label><input id="endDate" type="date"></div>
      <div class="field"><label for="gameFilter">游戏</label><select id="gameFilter"><option value="">全部游戏</option></select></div>
      <div class="field"><label for="channelFilter">渠道</label><select id="channelFilter"><option value="">全部渠道</option></select></div>
      <div class="field" id="countryField"><label for="countryFilter">国家 / 分组</label><select id="countryFilter"><option value="">全部</option></select></div>
      <div class="field"><label for="minSpend">最低花费</label><input id="minSpend" type="number" min="0" step="1" placeholder="0"></div>
      <div class="field grow"><label for="keyword">关键词</label><input id="keyword" type="search" placeholder="游戏、Campaign、Adset、Ad 或名称"></div>
    </div>
    <div class="preset-row" id="presets"><span class="small">快捷范围</span></div>
    <div class="view-row"><div class="view-tabs" id="viewTabs"></div><div class="view-help" id="viewHelp"></div></div>
    <div class="dim-wrap"><span class="dim-title">表格分组维度</span><span class="dim-list" id="dimensionList"></span></div>
  </section>
  <div class="cards" id="cards"></div>
  <div class="grid">
    <section class="panel"><div class="panel-head"><h2>按日趋势</h2><div class="legend"><span><i class="dot blue"></i><span id="barLegend">花费</span></span><span><i class="dot green"></i><span id="lineLegend">测转安装</span></span></div></div><div class="trend" id="trend"></div></section>
    <section class="panel"><div class="panel-head"><h2 id="tableTitle">游戏总览</h2><div class="status" id="queryStatus">等待加载</div></div><div class="quality" id="qualitySummary"></div><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="pager"><span class="small" id="pageInfo"></span><button id="prevPage">上一页</button><button id="nextPage">下一页</button></div></section>
  </div>
</main>
<script>
"use strict";
const CACHE_TTL=15*60*1000,CACHE_NAME="ai-game-performance-v1",PAGE_SIZE=100;
const $=id=>document.getElementById(id);
const VIEW_CONFIG={
  overview:{label:"游戏总览",help:"渠道事实与产品测转化仅在日期、游戏、渠道共享维度合并。",country:null,defaultDims:["game_name","game_id","channel"],dims:["dt","game_name","game_id","channel","mapping_status","spend_source"]},
  delivery:{label:"渠道明细",help:"渠道事实与转化事实并列汇总，不做原始行 Join；Unity 安装/曝光/点击来自 ads_unity_insights，Starts=曝光；“仅转化侧”表示该行没有渠道国家。",country:"source_country",defaultDims:["game_name","game_id","channel","source_country"],dims:["dt","game_name","game_id","channel","mapping_status","spend_source","source_country","conversion_country","campaign_id","adset_id","ad_id"]},
  conversion:{label:"转化明细",help:"来自 ads_manual_daily_performance；国家字段是转化国家。",country:"conversion_country",defaultDims:["game_name","game_id","channel","conversion_country"],dims:["dt","game_name","game_id","channel","conversion_country","campaign_id","adset_id","ad_id","campaign_name","adset_name","ad_name"]}
};
const LABELS={dt:"日期",game_name:"游戏",game_id:"游戏ID",channel:"渠道",mapping_status:"归属状态",spend_source:"花费来源",source_country:"渠道国家/分组",conversion_country:"转化国家",campaign_id:"Campaign ID",adset_id:"Adset ID",ad_id:"Ad ID",campaign_name:"Campaign 名称",adset_name:"Adset 名称",ad_name:"Ad 名称",effective_spend:"有效花费",source_spend:"渠道花费",source_installs:"渠道安装",source_impressions:"曝光",source_clicks:"点击",source_ctr:"CTR",source_cpi:"渠道CPI",manual_cost:"手工成本(对账)",manual_installs:"测转安装",d1_retained:"D1留存数",d1_retention_rate:"D1留存率",avg_play_duration_seconds:"平均游戏时长",day0_revenue:"D0收入",day1_revenue:"D1收入",d0_roas:"D0 ROAS",cost_per_d1_retained:"每D1留存成本"};
const VIEW_METRICS={
  overview:["effective_spend","source_installs","manual_installs","d1_retained","d1_retention_rate","avg_play_duration_seconds","day0_revenue","day1_revenue","d0_roas","cost_per_d1_retained","source_impressions","source_clicks","source_ctr","source_cpi","manual_cost"],
  delivery:["effective_spend","source_spend","manual_cost","source_installs","manual_installs","d1_retained","source_impressions","source_clicks","source_ctr","source_cpi"],
  conversion:["manual_cost","manual_installs","d1_retained","d1_retention_rate","avg_play_duration_seconds","day0_revenue","day1_revenue"]
};
const BASE_NUMERIC=["effective_spend","source_spend","source_installs","source_impressions","source_clicks","manual_cost","manual_installs","d1_retained","play_total_seconds","play_weight_installs","day0_revenue","day1_revenue","source_row_count","manual_row_count"];
const UNITY_CHANNEL="unityads_int";
const MONEY=new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),INT=new Intl.NumberFormat("en-US",{maximumFractionDigits:0}),PCT=new Intl.NumberFormat("zh-CN",{style:"percent",minimumFractionDigits:2,maximumFractionDigits:2});
let manifest=null,currentView="overview",selectedDims=[],loadedRows=[],filteredRows=[],visibleRows=[],groupedRows=[],page=1,loadToken=0;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function ratio(a,b){a=Number(a||0);b=Number(b||0);return b?a/b:0}
function formatValue(key,value){value=Number(value||0);if(["source_ctr","d1_retention_rate","d0_roas"].includes(key))return PCT.format(value);if(["effective_spend","source_spend","source_cpi","manual_cost","day0_revenue","day1_revenue","cost_per_d1_retained"].includes(key))return "$"+MONEY.format(value);if(key==="avg_play_duration_seconds")return MONEY.format(value/60)+" min";return INT.format(value)}
function exportLabel(key){return key==="avg_play_duration_seconds"?"平均游戏时长(min)":LABELS[key]||key}
function exportValue(key,value){return key==="avg_play_duration_seconds"?(Number(value||0)/60).toFixed(2):value??""}
function dateList(start,end){const out=[],cursor=new Date(start+"T00:00:00+08:00"),last=new Date(end+"T00:00:00+08:00");while(cursor<=last){out.push(cursor.toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"}));cursor.setUTCDate(cursor.getUTCDate()+1)}return out}
function setStatus(message,isError=false){$("queryStatus").textContent=message;$("queryStatus").style.color=isError?"#dc2626":""}
async function loadManifest(){setStatus("正在读取最新索引…");const response=await fetch("latest.json?v="+Date.now(),{cache:"no-store",credentials:"same-origin"});if(!response.ok)throw new Error("索引 HTTP "+response.status);const type=response.headers.get("content-type")||"";if(!type.includes("json")){const body=await response.text();throw new Error(body.includes("登录")||body.includes("login")?"登录态已失效，请重新打开页面完成飞书登录":"最新索引不是 JSON")};manifest=await response.json();renderMeta();buildViews();buildPresets();setInitialDates();await pruneClientCache();await loadCurrentView()}
function renderMeta(){const m=manifest.meta;$("metaLine").textContent=`${m.start_date} 至 ${m.end_date}｜更新 ${m.generated_at}｜版本 ${m.data_version}`;$("sourceNotice").textContent=m.source_note+" "+m.currency_note;const q=manifest.quality||{},notice=$("qualityNotice");notice.className="notice warn";const hasRisk=Number(q.ambiguous_rows||0)>0||Number(q.unmapped_rows||0)>0;notice.hidden=!hasRisk;if(hasRisk)notice.textContent=`数据归属提示：唯一归属 ${PCT.format(q.mapped_spend_ratio||0)} 花费；多游戏 ${INT.format(q.ambiguous_rows||0)} 行 / $${MONEY.format(q.ambiguous_spend||0)}；未归属 ${INT.format(q.unmapped_rows||0)} 行 / $${MONEY.format(q.unmapped_spend||0)}。这些金额没有被猜测分摊。`}
function setInitialDates(){const m=manifest.meta,available=Object.keys(manifest.data_files.overview||{}).sort(),fallback=available[available.length-1]||m.end_date,preferred=available.includes(m.default_date)?m.default_date:fallback;["startDate","endDate"].forEach(id=>{$(id).min=m.start_date;$(id).max=m.end_date;$(id).value=preferred})}
function buildPresets(){const host=$("presets");host.replaceChildren(el("span","small","快捷范围"));[[0,"今天"],[1,"昨天"],[3,"近3天"],[7,"近7天"],[14,"近14天"]].forEach(([days,label])=>{const b=el("button","chip",label);b.type="button";b.addEventListener("click",()=>applyPreset(days));host.appendChild(b)})}
function applyPreset(days){const end=days===1?new Date(manifest.meta.end_date+"T00:00:00+08:00"):new Date(manifest.meta.end_date+"T00:00:00+08:00");if(days===1)end.setUTCDate(end.getUTCDate()-1);const start=new Date(end);if(days>1)start.setUTCDate(start.getUTCDate()-(days-1));const fmt=d=>d.toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"});$("startDate").value=clampDate(fmt(start));$("endDate").value=clampDate(fmt(end));loadCurrentView().catch(showError)}
function clampDate(value){if(value<manifest.meta.start_date)return manifest.meta.start_date;if(value>manifest.meta.end_date)return manifest.meta.end_date;return value}
function buildViews(){const host=$("viewTabs");host.replaceChildren();Object.entries(VIEW_CONFIG).forEach(([key,cfg])=>{const b=el("button","view-tab"+(key===currentView?" active":""),cfg.label);b.type="button";b.dataset.view=key;b.addEventListener("click",()=>switchView(key));host.appendChild(b)});selectedDims=[...VIEW_CONFIG[currentView].defaultDims];renderDimensions();$("viewHelp").textContent=VIEW_CONFIG[currentView].help}
async function switchView(view){if(view===currentView)return;currentView=view;page=1;selectedDims=[...VIEW_CONFIG[view].defaultDims];document.querySelectorAll(".view-tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("viewHelp").textContent=VIEW_CONFIG[view].help;renderDimensions();await loadCurrentView()}
function renderDimensions(){const host=$("dimensionList");host.replaceChildren();VIEW_CONFIG[currentView].dims.forEach(key=>{const b=el("button","dim-chip"+(selectedDims.includes(key)?" active":""),LABELS[key]||key);b.type="button";b.dataset.dim=key;b.addEventListener("click",()=>toggleDimension(key));host.appendChild(b)})}
function toggleDimension(key){if(selectedDims.includes(key)){if(selectedDims.length===1)return;selectedDims=selectedDims.filter(v=>v!==key)}else selectedDims.push(key);page=1;renderDimensions();renderAll()}
async function loadDataFile(path){const url=new URL(path,location.href);url.searchParams.set("v",manifest.meta.data_version);const request=new Request(url.toString(),{credentials:"same-origin"});if("caches" in window){const cache=await caches.open(CACHE_NAME),cached=await cache.match(request);if(cached){const saved=Number(cached.headers.get("x-ai-game-cache-saved-at")||0);if(saved&&Date.now()-saved<CACHE_TTL)return cached.json();await cache.delete(request)}const response=await fetch(request,{cache:"no-store",credentials:"same-origin"});if(!response.ok)throw new Error(path+" HTTP "+response.status);const blob=await response.clone().blob(),headers=new Headers(response.headers);headers.set("x-ai-game-cache-saved-at",String(Date.now()));await cache.put(request,new Response(blob,{status:200,headers}));return response.json()}const response=await fetch(request,{cache:"no-store",credentials:"same-origin"});if(!response.ok)throw new Error(path+" HTTP "+response.status);return response.json()}
async function pruneClientCache(){if(!("caches" in window))return;const cache=await caches.open(CACHE_NAME),keys=await cache.keys();await Promise.all(keys.map(async key=>{const response=await cache.match(key),saved=Number(response&&response.headers.get("x-ai-game-cache-saved-at")||0);if(!saved||Date.now()-saved>=CACHE_TTL)await cache.delete(key)}))}
function decodePayload(payload){const dictCols=new Set(payload.dict_columns||[]),idx={};(payload.columns||[]).forEach((key,i)=>idx[key]=i);return(payload.rows||[]).map(compact=>{const row={};payload.columns.forEach((key,i)=>{const value=compact[i];row[key]=dictCols.has(key)?((payload.dicts[key]||[])[value]||""):value});return row})}
function channelFact(row,factType){const out={...row};if(factType==="delivery"){out.spend_source=out.channel===UNITY_CHANNEL?"none":"custom_source_insight";out.conversion_country="";out.effective_spend=Number(out.source_spend||0);out.manual_cost=0;out.manual_installs=0;out.d1_retained=0;out.play_total_seconds=0;out.play_weight_installs=0;out.day0_revenue=0;out.day1_revenue=0;out.manual_row_count=0;return out}out.mapping_status="manual_only";out.spend_source=out.channel===UNITY_CHANNEL?"manual_fallback":"none";out.source_country="仅转化侧";out.effective_spend=out.channel===UNITY_CHANNEL?Number(out.manual_cost||0):0;out.source_spend=0;out.source_installs=0;out.source_impressions=0;out.source_clicks=0;out.source_row_count=0;out.play_total_seconds=Number(out.play_total_seconds??out.play_duration_seconds??0);out.play_weight_installs=Number(out.play_weight_installs??(Number(out.manual_installs||0)>0?out.manual_installs:0));return out}
async function loadCurrentView(){if(!manifest)return;const token=++loadToken,requestedView=currentView,start=$("startDate").value,end=$("endDate").value;if(!start||!end||start>end){setStatus("日期范围无效",true);return}const days=dateList(start,end),viewKeys=requestedView==="delivery"?["delivery","conversion"]:[requestedView],missing=[],requests=[];days.forEach(day=>viewKeys.forEach(viewKey=>{const path=(manifest.data_files[viewKey]||{})[day];if(path)requests.push(loadDataFile(path).then(payload=>({viewKey,payload})));else missing.push(`${day}/${viewKey}`)}));setStatus(`正在加载 ${days.length} 个日快照…`);$("exportBtn").disabled=true;const payloads=await Promise.all(requests);if(token!==loadToken)return;loadedRows=payloads.flatMap(({viewKey,payload})=>{const rows=decodePayload(payload);return requestedView==="delivery"?rows.map(row=>channelFact(row,viewKey)):rows});if(missing.length)setStatus(`已加载 ${INT.format(loadedRows.length)} 行；${missing.join("、")} 无快照`,true);else setStatus(`已加载 ${INT.format(loadedRows.length)} 行`);page=1;rebuildFilters();renderAll();$("exportBtn").disabled=false}
function optionValues(rows,key){return [...new Set(rows.map(row=>String(row[key]||"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-CN",{numeric:true}))}
function fillSelect(id,label,values){const select=$(id),old=select.value;select.replaceChildren();const first=el("option",null,label);first.value="";select.appendChild(first);values.forEach(value=>{const option=el("option",null,value);option.value=value;select.appendChild(option)});if(values.includes(old))select.value=old}
function rebuildFilters(){fillSelect("gameFilter","全部游戏",optionValues(loadedRows,"game_name"));fillSelect("channelFilter","全部渠道",optionValues(loadedRows,"channel"));const country=VIEW_CONFIG[currentView].country;$("countryField").hidden=!country;if(country)fillSelect("countryFilter","全部",optionValues(loadedRows,country));else $("countryFilter").value=""}
function applyFilters(rows){const game=$("gameFilter").value,channel=$("channelFilter").value,country=$("countryFilter").value,countryKey=VIEW_CONFIG[currentView].country,keyword=$("keyword").value.trim().toLocaleLowerCase();return rows.filter(row=>{if(game&&row.game_name!==game)return false;if(channel&&row.channel!==channel)return false;if(country&&countryKey&&row[countryKey]!==country)return false;if(keyword){const hay=[row.game_name,row.game_id,row.campaign_id,row.adset_id,row.ad_id,row.campaign_name,row.adset_name,row.ad_name].join(" ").toLocaleLowerCase();if(!hay.includes(keyword))return false}return true})}
function blankAggregate(dims,row){const out={};dims.forEach(key=>out[key]=row[key]??"");BASE_NUMERIC.forEach(key=>out[key]=0);out._mapping=new Set();out._sources=new Set();return out}

function renderTrend(){const host=$("trend"),[barKey,lineKey,barLabel,lineLabel]=trendMetrics();$("barLegend").textContent=barLabel;$("lineLegend").textContent=lineLabel;const daily=aggregate(visibleRows,["dt"],currentView).sort((a,b)=>String(a.dt).localeCompare(String(b.dt)));host.replaceChildren();if(!daily.length){host.appendChild(el("div","empty","当前筛选无趋势数据"));return}const width=Math.max(620,host.clientWidth||620),height=180,pad={l:44,r:20,t:14,b:28},innerW=width-pad.l-pad.r,innerH=height-pad.t-pad.b,maxBar=Math.max(...daily.map(r=>Number(r[barKey]||0)),1),maxLine=Math.max(...daily.map(r=>Number(r[lineKey]||0)),1),svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox",`0 0 ${width} ${height}`);const grid=document.createElementNS(svg.namespaceURI,"line");grid.setAttribute("x1",pad.l);grid.setAttribute("x2",width-pad.r);grid.setAttribute("y1",height-pad.b);grid.setAttribute("y2",height-pad.b);grid.setAttribute("stroke","#cbd5e1");svg.appendChild(grid);const step=innerW/daily.length,barW=Math.max(3,Math.min(24,step*.5)),points=[];daily.forEach((row,i)=>{const x=pad.l+step*(i+.5),barH=Number(row[barKey]||0)/maxBar*innerH,rect=document.createElementNS(svg.namespaceURI,"rect");rect.setAttribute("x",x-barW/2);rect.setAttribute("y",height-pad.b-barH);rect.setAttribute("width",barW);rect.setAttribute("height",barH);rect.setAttribute("rx","2");rect.setAttribute("fill","#93c5fd");svg.appendChild(rect);const y=height-pad.b-Number(row[lineKey]||0)/maxLine*innerH;points.push(`${x},${y}`);if(daily.length<=14||i%Math.ceil(daily.length/10)===0){const label=document.createElementNS(svg.namespaceURI,"text");label.setAttribute("x",x);label.setAttribute("y",height-8);label.setAttribute("text-anchor","middle");label.setAttribute("font-size","10");label.setAttribute("fill","#64748b");label.textContent=String(row.dt).slice(5);svg.appendChild(label)}});const line=document.createElementNS(svg.namespaceURI,"polyline");line.setAttribute("points",points.join(" "));line.setAttribute("fill","none");line.setAttribute("stroke","#0f9f6e");line.setAttribute("stroke-width","2.5");line.setAttribute("stroke-linejoin","round");svg.appendChild(line);host.appendChild(svg)}

function exportCsv(){if(!groupedRows.length)return;const metrics=VIEW_METRICS[currentView],columns=[...selectedDims,...metrics,"mapping_status","spend_source"].filter((v,i,a)=>a.indexOf(v)===i),escape=value=>'"'+String(value??"").replace(/"/g,'""')+'"',lines=[columns.map(k=>escape(exportLabel(k))).join(",")];groupedRows.forEach(row=>lines.push(columns.map(key=>escape(exportValue(key,row[key]))).join(",")));const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`ai_game_performance_${currentView}_${$("startDate").value}_${$("endDate").value}_${manifest.meta.data_version}.csv`;link.hidden=true;document.body.appendChild(link);link.click();window.setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove()},1000)}

location = /reports/ai-game-performance {
    return 302 /reports/ai-game-performance/;
}

location ^~ /reports/ai-game-performance/data/ {
    auth_request /_tt_minis_report_auth;
    error_page 401 = @ai_game_report_login;
    error_page 403 = @ai_game_report_forbidden;

    try_files $uri =404;
    add_header Cache-Control "private, max-age=900" always;
    add_header Vary "Cookie" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;
    gzip_vary on;
}

location ^~ /reports/ai-game-performance/ {
    auth_request /_tt_minis_report_auth;
    error_page 401 = @ai_game_report_login;
    error_page 403 = @ai_game_report_forbidden;

    try_files $uri $uri/index.html /reports/ai-game-performance/index.html;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;
}

location @ai_game_report_login {
    return 302 /api/auth/feishu/login?next=/reports/ai-game-performance/;
}

location @ai_game_report_forbidden {
    default_type text/html;
    return 403 '<!doctype html><html><head><meta charset="utf-8"><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1><p>This report is only available to approved Feishu tenant users.</p></body></html>';
}

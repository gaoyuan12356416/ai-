location = /reports/dramawave-attribution-comparison {
    return 301 /reports/dramawave-attribution-comparison/;
}

location = /reports/dramawave-attribution-comparison/healthz {
    auth_request /_dramawave_attribution_comparison_auth;
    error_page 401 = @dramawave_attribution_comparison_login;
    error_page 403 = @dramawave_attribution_comparison_forbidden;

    proxy_pass http://127.0.0.1:8832/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /reports/dramawave-attribution-comparison/api/ {
    auth_request /_dramawave_attribution_comparison_auth;
    error_page 401 = @dramawave_attribution_comparison_login;
    error_page 403 = @dramawave_attribution_comparison_forbidden;

    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8832/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_read_timeout 30s;

    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain;
    gzip_vary on;
}

location ^~ /reports/dramawave-attribution-comparison/ {
    auth_request /_dramawave_attribution_comparison_auth;
    error_page 401 = @dramawave_attribution_comparison_login;
    error_page 403 = @dramawave_attribution_comparison_forbidden;

    proxy_pass http://127.0.0.1:8832/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_read_timeout 30s;

    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;
    gzip_vary on;
}

location = /_dramawave_attribution_comparison_auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/report-auth/tt-minis-native-growth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @dramawave_attribution_comparison_login {
    return 302 /api/auth/feishu/login?next=/reports/dramawave-attribution-comparison/;
}

location @dramawave_attribution_comparison_forbidden {
    default_type text/html;
    return 403 '<!doctype html><html><head><meta charset="utf-8"><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1><p>This report is only available to approved Feishu tenant users.</p></body></html>';
}

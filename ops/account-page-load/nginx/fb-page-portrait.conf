location = /api/fb-page-portraits {
    # Compress read-only list/portrait JSON; responses remain private/no-store.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;
    proxy_pass http://127.0.0.1:18852;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/fb-page-portraits/ {
    # Compress read-only list/portrait JSON; responses remain private/no-store.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;
    proxy_pass http://127.0.0.1:18852;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}

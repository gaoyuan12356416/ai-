[Unit]
RequiresMountsFor=/mnt/data-disk

[Service]
Environment=TMPDIR=/mnt/data-disk/dramawave-attribution-comparison/tmp
Environment=SQLITE_TMPDIR=/mnt/data-disk/dramawave-attribution-comparison/tmp
ReadWritePaths=
ReadWritePaths=/mnt/data-disk/dramawave-attribution-comparison /tmp/tt_minis_multi_dim_dashboard.lock
ExecStartPre=/usr/bin/python3 /opt/cpu-root-storage-current/storage_guard.py
InaccessiblePaths=/var/tmp -/usr/tmp
ReadOnlyPaths=/tmp

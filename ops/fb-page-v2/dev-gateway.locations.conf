location = /api/integrations/v2/drama-page-assignments {
    include /etc/nginx/snippets/fb-page-v2-dev-proxy.conf;
    proxy_pass http://127.0.0.1:19845/api/integrations/v2/drama-page-assignments;
}
location = /api/integrations/v2/drama-page-assignments/healthz {
    include /etc/nginx/snippets/fb-page-v2-dev-proxy.conf;
    proxy_pass http://127.0.0.1:19845/healthz;
}
location @fb_page_v2_dev_unavailable {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 503 '{"error":"dev_gateway_unavailable"}';
}
location @fb_page_v2_dev_busy {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"dev_gateway_busy"}';
}
location @fb_page_v2_dev_large {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control no-store always;
    return 413 '{"error":"body_too_large"}';
}

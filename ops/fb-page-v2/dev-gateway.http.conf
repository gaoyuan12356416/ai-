# This file is included at http scope. The private Bearer map is generated on host.
limit_conn_zone $server_name zone=fb_page_v2_dev_connections:1m;
limit_req_zone $binary_remote_addr zone=fb_page_v2_dev_requests:1m rate=5r/s;
map $upstream_http_x_request_id $fb_page_v2_dev_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}

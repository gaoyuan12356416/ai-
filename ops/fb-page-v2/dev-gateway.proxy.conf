default_type application/json;
if ($scheme != https) { return 426 '{"error":"https_required"}'; }
if ($fb_page_v2_dev_authorized = 0) { return 401 '{"error":"unauthorized"}'; }
client_max_body_size 64k;
client_body_timeout 10s;
limit_conn fb_page_v2_dev_connections 5;
limit_conn_status 429;
limit_req zone=fb_page_v2_dev_requests burst=10 nodelay;
limit_req_status 429;
proxy_connect_timeout 3s;
proxy_send_timeout 10s;
proxy_read_timeout 50s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_hide_header X-Request-ID;
add_header X-Request-ID $fb_page_v2_dev_request_id always;
add_header Cache-Control no-store always;
error_page 502 504 =503 @fb_page_v2_dev_unavailable;
error_page 429 =429 @fb_page_v2_dev_busy;
error_page 413 =413 @fb_page_v2_dev_large;

location = /reports/opay-excellent-creatives {
    auth_request off;
    auth_basic off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 /reports/opay-excellent-creatives/;
}

location = /reports/opay-excellent-creatives/latest.json {
    auth_request off;
    auth_basic off;
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /reports/opay-excellent-creatives/data/ {
    auth_request off;
    auth_basic off;
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /reports/opay-excellent-creatives/assets/ {
    auth_request off;
    auth_basic off;
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /reports/opay-excellent-creatives/ {
    auth_request off;
    auth_basic off;
    root /usr/share/nginx/html;
    try_files $uri $uri/index.html /reports/opay-excellent-creatives/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
}

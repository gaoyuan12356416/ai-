# Only card reads use this service. Authentication delegates to the main API.
location = /api/youtube-auto-publish/material-cards {
    proxy_pass http://127.0.0.1:8851;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_cache off;
    gzip on;
    gzip_min_length 256;
    gzip_types application/json;
    gzip_vary on;
}

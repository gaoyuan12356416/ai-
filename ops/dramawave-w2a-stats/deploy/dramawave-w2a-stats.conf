# Exact endpoint; the dedicated service owns Bearer + CIDR authorization.
location = /api/v1/dramawave/w2a/2334/daily-stats {
    if ($scheme != https) { return 308 https://ai.yingliangads.com$request_uri; }
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # Overwrite client-supplied headers instead of appending them.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_cache off;
}

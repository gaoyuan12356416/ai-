location ^~ /api/image-generation/ {
    allow 101.32.30.18;
    deny all;
    client_max_body_size 1m;
    error_page 403 = @codex_image_ip_denied;
    error_page 413 = @codex_image_body_too_large;
    proxy_pass http://127.0.0.1:18853;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Token $http_x_api_token;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location @codex_image_ip_denied {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":{"code":"ip_not_allowed","message":"Source IP is not allowed"}}';
}

location @codex_image_body_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"request_too_large","message":"Request body exceeds 1 MiB"}}';
}

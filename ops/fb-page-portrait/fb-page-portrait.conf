location = /api/fb-page-portraits {
    proxy_pass http://127.0.0.1:18852;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/fb-page-portraits/ {
    proxy_pass http://127.0.0.1:18852;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
